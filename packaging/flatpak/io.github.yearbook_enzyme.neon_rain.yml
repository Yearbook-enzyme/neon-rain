id: io.github.yearbook_enzyme.neon_rain
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: neon-rain

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-music:ro
  - --talk-name=org.mpris.MediaPlayer2.strawberry

modules:
  - name: neon-rain
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/neon-rain/cargo
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/neon-rain /app/bin/neon-rain
      - install -Dm644 packaging/flatpak/io.github.yearbook_enzyme.neon_rain.desktop /app/share/applications/io.github.yearbook_enzyme.neon_rain.desktop
      - install -Dm644 packaging/flatpak/io.github.yearbook_enzyme.neon_rain.metainfo.xml /app/share/metainfo/io.github.yearbook_enzyme.neon_rain.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.yearbook_enzyme.neon_rain.png /app/share/icons/hicolor/512x512/apps/io.github.yearbook_enzyme.neon_rain.png
      - install -Dm644 config/neon-rain.conf /app/share/neon-rain/config.example.conf
      - install -Dm644 LICENSE /app/share/licenses/neon-rain/LICENSE
      - install -Dm644 README.md /app/share/doc/neon-rain/README.md
      - install -Dm644 docs/FLATPAK.md /app/share/doc/neon-rain/FLATPAK.md
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
